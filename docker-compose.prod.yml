services:
  api-gateway:
    environment:
      CORS_ORIGINS: https://${DOMAIN}
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api-gateway
      - frontend

volumes:
  caddy-data:
  caddy-config:

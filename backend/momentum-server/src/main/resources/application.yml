spring:
  application:
    name: momentum-server
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:momentum;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: ${POSTGRES_USER:sa}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

momentum:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-256-bit-secret-key-please-use-openssl}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  bootstrap:
    email: ${BOOTSTRAP_USER_EMAIL:you@momentum.local}
    password: ${BOOTSTRAP_USER_PASSWORD:ChangeMeNow!}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:4200}
  journal:
    missed-cron: ${JOURNAL_MISSED_CRON:0 59 23 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
momentum:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-256-bit-secret-key-please-use-openssl}
